---
# File: main.yml handlers file for nomad

- name: stop nomad
  service:
    name: nomad
    state: stopped
  when: _nomad_node_server | bool
  listen: "restart nomad"
  throttle: 1

- name: wait 30 seconds
  pause:
    seconds: 30
  when: _nomad_node_server | bool
  listen: "restart nomad"

- name: start nomad
  service:
    name: nomad
    state: started
  when: _nomad_node_server | bool
  listen: "restart nomad"

- name: wait for server
  wait_for:
    port: 4646
    timeout: 120
  when: _nomad_node_server | bool
  listen: "restart nomad"
  throttle: 1

- name: restart client
  service:
    name: nomad
    state: restarted
  when: not (_nomad_node_server | bool)
  listen: "restart nomad"

- name: wait for client
  wait_for:
    port: 4646
    timeout: 120
  when: not (_nomad_node_server | bool)
  listen: "restart nomad"
